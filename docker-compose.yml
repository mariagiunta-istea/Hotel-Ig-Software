version: '3.8'

services:
  # Servicio de MySQL
  mysql:
    image: mysql:8.0
    container_name: hotel_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Dev!123
      MYSQL_DATABASE: Hotel
    ports:
      - "3307:3306"
    volumes:
      # Esto persiste los datos de la base de datos
      - mysql_data:/var/lib/mysql
      # Importa automáticamente el archivo SQL al iniciar
      - ./DATABASE_HOTEL/Hotel_con_datos.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de la aplicación .NET
  api:
    build: .
    container_name: hotel_api
    environment:
      # Variables de entorno (se pueden sobrescribir aquí)
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=Hotel;User=root;Password=Dev!123;AllowPublicKeyRetrieval=True;SslMode=None;"
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hotel_network
    restart: unless-stopped

# Volumen para persistir datos de MySQL
volumes:
  mysql_data:

# Red personalizada para que los contenedores se comuniquen
networks:
  hotel_network:
    driver: bridge
